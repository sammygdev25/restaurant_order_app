# Auto-generated by Shikshya — Deploy Pipeline
# Runs on push to main (after CI passes)
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_NAME: "restaurant_order_app"
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$(date +%Y%m%d)-$VERSION" >> $GITHUB_OUTPUT

      # ── Build ────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.APP_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.APP_NAME }}:latest \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            .

      - name: Push to registry
        if: env.REGISTRY != ''
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag ${{ env.APP_NAME }}:${{ steps.version.outputs.version }} ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ steps.version.outputs.version }}
          docker tag ${{ env.APP_NAME }}:latest ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.APP_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.REGISTRY }}/${{ env.APP_NAME }}:latest

      # ── Pre-Deploy Safety ────────────────────────────────────
      - name: Backup database
        run: |
          chmod +x scripts/migrate.sh
          ./scripts/migrate.sh backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Check migration safety
        run: ./scripts/migrate.sh check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Deploy ───────────────────────────────────────────────
      - name: Deploy
        run: docker compose -f docker-compose.prod.yml up -d --wait --timeout 120
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Run migrations
        run: ./scripts/migrate.sh apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Post-Deploy Verification ─────────────────────────────
      - name: Health check
        id: healthcheck
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh
        env:
          HEALTH_URL: http://localhost:8000/health/
          MAX_RETRIES: "10"
          RETRY_INTERVAL: "5"

      # ── Rollback on Failure ──────────────────────────────────
      - name: Rollback on failure
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          echo "::error::Health check failed - initiating rollback"
          chmod +x scripts/rollback.sh
          ./scripts/rollback.sh auto
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Tag Release ──────────────────────────────────────────
      - name: Tag release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Deploy ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Deploy summary
        if: always()
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.version.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
